  <rect x="800" y="110" width="100" height="298" fill="#5a5248"/>
  <path d="M810,250 Q850,215 890,250" fill="none" stroke="#7a726a" stroke-width="6"/>
  <path d="M810,250 Q850,215 890,250 L890,290 L810,290 Z" fill="#504840" opacity="0.6"/>
  <path d="M815,190 Q850,162 885,190" fill="none" stroke="#7a726a" stroke-width="4"/>
  <rect x="798" y="102" width="104" height="16" fill="#6a6258"/>
  <rect x="805" y="94" width="90" height="14" fill="#6a6258"/>
  <!-- Main suspension cables — from tops of towers to ground anchors -->
  <!-- Left cable from left tower top -->
  <path d="M350,102 Q150,340 0,408" fill="none" stroke="#4a4238" stroke-width="5" opacity="0.85"/>
  <path d="M350,102 Q600,250 850,108" fill="none" stroke="#4a4238" stroke-width="6" opacity="0.85"/>
  <path d="M850,108 Q1050,340 1200,408" fill="none" stroke="#4a4238" stroke-width="5" opacity="0.85"/>
  <!-- Secondary cable (slightly offset) -->
  <path d="M340,106 Q138,342 0,415" fill="none" stroke="#3a3228" stroke-width="3" opacity="0.5"/>
  <path d="M340,106 Q600,255 860,112" fill="none" stroke="#3a3228" stroke-width="4" opacity="0.5"/>
  <path d="M860,112 Q1062,342 1200,415" fill="none" stroke="#3a3228" stroke-width="3" opacity="0.5"/>
  <!-- Vertical suspender cables -->
  <g stroke="#4a4238" stroke-width="1.5" opacity="0.6">
    <line x1="200" y1="370" x2="212" y2="250"/>
    <line x1="230" y1="375" x2="244" y2="228"/>
    <line x1="260" y1="380" x2="276" y2="210"/>
    <line x1="400" y1="385" x2="408" y2="340"/>
    <line x1="430" y1="385" x2="436" y2="325"/>
    <line x1="460" y1="383" x2="464" y2="312"/>
    <line x1="490" y1="382" x2="492" y2="302"/>
    <line x1="520" y1="381" x2="520" y2="294"/>
    <line x1="550" y1="380" x2="548" y2="287"/>
    <line x1="580" y1="380" x2="576" y2="284"/>
    <line x1="610" y1="381" x2="606" y2="284"/>
    <line x1="640" y1="381" x2="636" y2="288"/>
    <line x1="670" y1="382" x2="666" y2="296"/>
    <line x1="700" y1="383" x2="696" y2="308"/>
    <line x1="730" y1="384" x2="726" y2="320"/>
    <line x1="760" y1="385" x2="758" y2="334"/>
    <line x1="960" y1="380" x2="956" y2="340"/>
    <line x1="990" y1="376" x2="984" y2="325"/>
    <line x1="1020" y1="372" x2="1012" y2="308"/>
    <line x1="1050" y1="368" x2="1040" y2="292"/>
    <line x1="1080" y1="364" x2="1068" y2="278"/>
  </g>
  <!-- Pedestrians on walkway -->
  <g fill="#3a3020" opacity="0.75">
    <circle cx="480" cy="354" r="5"/>
    <rect x="477" y="359" width="6" height="14" rx="2"/>
    <circle cx="520" cy="353" r="5"/>
    <rect x="517" y="358" width="6" height="14" rx="2"/>
    <circle cx="580" cy="354" r="5"/>
    <rect x="577" y="359" width="6" height="14" rx="2"/>
    <circle cx="630" cy="353" r="4.5"/>
    <rect x="628" y="357" width="6" height="14" rx="2"/>
    <circle cx="700" cy="354" r="5"/>
    <rect x="697" y="359" width="6" height="14" rx="2"/>
  </g>
</svg>
