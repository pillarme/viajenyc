<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bbSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2d5a"/>
      <stop offset="30%" stop-color="#2e5080"/>
      <stop offset="60%" stop-color="#d4704a"/>
      <stop offset="80%" stop-color="#e88840"/>
      <stop offset="100%" stop-color="#c86030"/>
    </linearGradient>
    <linearGradient id="bbWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243a58"/>
      <stop offset="100%" stop-color="#0e1c2c"/>
    </linearGradient>
    <radialGradient id="bbSun" cx="75%" cy="58%" r="35%">
      <stop offset="0%" stop-color="#ffdd88" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff9944" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff9944" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sky gradient -->
  <rect width="1200" height="750" fill="url(#bbSky)"/>
  <rect width="1200" height="750" fill="url(#bbSun)"/>
  <!-- Clouds -->
  <ellipse cx="200" cy="120" rx="130" ry="36" fill="#f8d0a0" opacity="0.45"/>
  <ellipse cx="160" cy="124" rx="85" ry="27" fill="#f8d0a0" opacity="0.45"/>
  <ellipse cx="260" cy="128" rx="95" ry="25" fill="#f8d0a0" opacity="0.45"/>
  <ellipse cx="620" cy="95" rx="160" ry="44" fill="#f8d0a0" opacity="0.35"/>
  <!-- Manhattan skyline (left side, background) -->
  <g fill="#1a2a40" opacity="0.7">
    <rect x="0" y="175" width="40" height="270"/>
    <rect x="44" y="155" width="35" height="290"/>
    <rect x="83" y="165" width="42" height="280"/>
    <rect x="129" y="142" width="38" height="303"/>
    <!-- Empire State silhouette -->
    <rect x="175" y="90" width="48" height="355"/>
    <rect x="189" y="70" width="20" height="40"/>
    <rect x="196" y="55" width="6" height="22"/>
    <rect x="227" y="152" width="42" height="293"/>
    <rect x="273" y="168" width="36" height="277"/>
    <rect x="313" y="148" width="44" height="297"/>
    <rect x="361" y="162" width="38" height="283"/>
    <rect x="403" y="172" width="45" height="273"/>
  </g>
  <!-- East River -->
  <rect x="0" y="445" width="1200" height="305" fill="url(#bbWater)"/>
  <!-- Water shimmer -->
  <path d="M0,470 Q200,462 400,470 Q600,478 800,470 Q1000,462 1200,470" fill="none" stroke="#4a7a9a" stroke-width="2" opacity="0.5"/>
  <path d="M0,495 Q300,487 600,495 Q900,503 1200,495" fill="none" stroke="#4a7a9a" stroke-width="1.5" opacity="0.4"/>
  <path d="M0,525 Q250,517 500,525 Q750,533 1000,525 Q1100,520 1200,525" fill="none" stroke="#3a6a8a" stroke-width="1" opacity="0.3"/>
  <!-- Sunset reflection -->
  <ellipse cx="900" cy="470" rx="300" ry="35" fill="#e87030" opacity="0.14"/>
  <path d="M700,460 Q900,450 1100,460" fill="none" stroke="#ffaa44" stroke-width="3" opacity="0.2"/>
  <!-- Brooklyn (right) ground -->
  <rect x="750" y="435" width="450" height="12" fill="#3a3028"/>
  <!-- Bridge road deck -->
  <rect x="0" y="380" width="1200" height="28" fill="#5a5040" rx="2"/>
  <rect x="0" y="382" width="1200" height="6" fill="#6a6050" opacity="0.6"/>
  <!-- Road markings on deck -->
  <rect x="0" y="386" width="1200" height="3" fill="#888070" opacity="0.5"/>
  <rect x="0" y="392" width="1200" height="2" fill="#444038" opacity="0.6"/>
  <!-- Bridge walkway (elevated center) -->
  <rect x="430" y="358" width="340" height="26" fill="#6a6254" rx="2"/>
  <rect x="430" y="360" width="340" height="5" fill="#7a7264" opacity="0.6"/>
  <!-- Walkway railing -->
  <rect x="430" y="355" width="340" height="5" fill="#4a4438" rx="1"/>
  <rect x="430" y="375" width="340" height="4" fill="#4a4438" rx="1"/>
