    <line x1="440" y1="355" x2="440" y2="379"/>
    <line x1="455" y1="355" x2="455" y2="379"/>
    <line x1="470" y1="355" x2="470" y2="379"/>
    <line x1="485" y1="355" x2="485" y2="379"/>
    <line x1="500" y1="355" x2="500" y2="379"/>
    <line x1="515" y1="355" x2="515" y2="379"/>
    <line x1="530" y1="355" x2="530" y2="379"/>
    <line x1="545" y1="355" x2="545" y2="379"/>
    <line x1="560" y1="355" x2="560" y2="379"/>
    <line x1="575" y1="355" x2="575" y2="379"/>
    <line x1="590" y1="355" x2="590" y2="379"/>
    <line x1="605" y1="355" x2="605" y2="379"/>
    <line x1="620" y1="355" x2="620" y2="379"/>
    <line x1="635" y1="355" x2="635" y2="379"/>
    <line x1="650" y1="355" x2="650" y2="379"/>
    <line x1="665" y1="355" x2="665" y2="379"/>
    <line x1="680" y1="355" x2="680" y2="379"/>
    <line x1="695" y1="355" x2="695" y2="379"/>
    <line x1="710" y1="355" x2="710" y2="379"/>
    <line x1="725" y1="355" x2="725" y2="379"/>
    <line x1="740" y1="355" x2="740" y2="379"/>
    <line x1="755" y1="355" x2="755" y2="379"/>
  </g>
  <!-- Left tower (Gothic arch) -->
  <rect x="300" y="110" width="100" height="298" fill="#5a5248"/>
  <!-- Gothic arch on left tower -->
  <path d="M310,250 Q350,215 390,250" fill="none" stroke="#7a726a" stroke-width="6"/>
  <path d="M310,250 Q350,215 390,250 L390,290 L310,290 Z" fill="#504840" opacity="0.6"/>
  <!-- Second arch -->
  <path d="M315,190 Q350,162 385,190" fill="none" stroke="#7a726a" stroke-width="4"/>
