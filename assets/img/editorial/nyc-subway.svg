<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="subTunnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c12"/>
      <stop offset="100%" stop-color="#04040a"/>
    </linearGradient>
    <linearGradient id="subPlatform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2828"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <linearGradient id="subTrain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0c8d0"/>
      <stop offset="40%" stop-color="#d8e0e8"/>
      <stop offset="100%" stop-color="#b8c0c8"/>
    </linearGradient>
    <linearGradient id="subLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e040" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f5c518" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="subHeadlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f5e040" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tiles" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#2e2c3a"/>
      <rect x="1" y="1" width="29" height="29" fill="#363448" rx="1"/>
    </pattern>
  </defs>
  <!-- Background tunnel -->
  <rect width="1200" height="750" fill="url(#subTunnel)"/>
  <!-- Ceiling -->
  <rect x="0" y="0" width="1200" height="120" fill="#161420"/>
  <!-- Arched tunnel ceiling detail -->
  <path d="M0,130 Q100,60 200,130" fill="none" stroke="#282634" stroke-width="3" opacity="0.7"/>
  <path d="M200,130 Q300,60 400,130" fill="none" stroke="#282634" stroke-width="3" opacity="0.7"/>
  <path d="M400,130 Q500,60 600,130" fill="none" stroke="#282634" stroke-width="3" opacity="0.7"/>
  <path d="M600,130 Q700,60 800,130" fill="none" stroke="#282634" stroke-width="3" opacity="0.7"/>
  <path d="M800,130 Q900,60 1000,130" fill="none" stroke="#282634" stroke-width="3" opacity="0.7"/>
  <path d="M1000,130 Q1100,60 1200,130" fill="none" stroke="#282634" stroke-width="3" opacity="0.7"/>
  <!-- Tiled platform walls -->
  <rect x="0" y="120" width="270" height="420" fill="url(#tiles)"/>
  <rect x="930" y="120" width="270" height="420" fill="url(#tiles)"/>
  <!-- Station tile accent strips -->
  <rect x="0" y="120" width="270" height="12" fill="#cc2244"/>
  <rect x="0" y="158" width="270" height="8" fill="#cc2244" opacity="0.7"/>
  <rect x="0" y="340" width="270" height="12" fill="#cc2244"/>
  <rect x="930" y="120" width="270" height="12" fill="#cc2244"/>
  <rect x="930" y="158" width="270" height="8" fill="#cc2244" opacity="0.7"/>
  <rect x="930" y="340" width="270" height="12" fill="#cc2244"/>
  <!-- Station sign board -->
  <rect x="30" y="180" width="200" height="48" fill="#1a1030" rx="4"/>
  <rect x="34" y="184" width="192" height="40" fill="#220c40" rx="3"/>
  <!-- Sign text blocks (white lines representing text) -->
  <rect x="50" y="196" width="100" height="12" fill="#f5c518" rx="2" opacity="0.9"/>
  <rect x="50" y="212" width="140" height="8" fill="white" rx="1" opacity="0.7"/>
  <!-- Hanging fluorescent lights on ceiling -->
  <g opacity="0.9">
    <rect x="80" y="60" width="120" height="18" fill="#f5e8a0" rx="4"/>
    <rect x="80" y="60" width="120" height="18" fill="url(#subLight)" rx="4"/>
    <line x1="140" y1="40" x2="140" y2="60" stroke="#888" stroke-width="2"/>
    <rect x="380" y="60" width="120" height="18" fill="#f5e8a0" rx="4"/>
    <rect x="380" y="60" width="120" height="18" fill="url(#subLight)" rx="4"/>
    <line x1="440" y1="40" x2="440" y2="60" stroke="#888" stroke-width="2"/>
    <rect x="680" y="60" width="120" height="18" fill="#f5e8a0" rx="4"/>
    <rect x="680" y="60" width="120" height="18" fill="url(#subLight)" rx="4"/>
    <line x1="740" y1="40" x2="740" y2="60" stroke="#888" stroke-width="2"/>
    <rect x="980" y="60" width="120" height="18" fill="#f5e8a0" rx="4"/>
    <rect x="980" y="60" width="120" height="18" fill="url(#subLight)" rx="4"/>
    <line x1="1040" y1="40" x2="1040" y2="60" stroke="#888" stroke-width="2"/>
  </g>
  <!-- Light glow pools on platform -->
  <ellipse cx="140" cy="540" rx="160" ry="40" fill="#f5e040" opacity="0.06"/>
  <ellipse cx="440" cy="540" rx="160" ry="40" fill="#f5e040" opacity="0.06"/>
  <ellipse cx="740" cy="540" rx="160" ry="40" fill="#f5e040" opacity="0.06"/>
  <ellipse cx="1040" cy="540" rx="160" ry="40" fill="#f5e040" opacity="0.06"/>
  <!-- Platform floor -->
  <rect x="0" y="540" width="1200" height="210" fill="url(#subPlatform)"/>
  <!-- Platform edge yellow strip -->
  <rect x="0" y="540" width="1200" height="14" fill="#f5c518" opacity="0.85"/>
  <!-- Platform edge tactile bumps -->
  <g fill="#d4ac16" opacity="0.7">
    <circle cx="20" cy="546" r="3"/>
    <circle cx="40" cy="546" r="3"/>
    <circle cx="60" cy="546" r="3"/>
    <circle cx="80" cy="546" r="3"/>
    <circle cx="100" cy="546" r="3"/>
    <circle cx="120" cy="546" r="3"/>
    <circle cx="140" cy="546" r="3"/>
    <circle cx="160" cy="546" r="3"/>
    <circle cx="180" cy="546" r="3"/>
    <circle cx="200" cy="546" r="3"/>
    <circle cx="220" cy="546" r="3"/>
    <circle cx="240" cy="546" r="3"/>
  </g>
  <!-- Platform floor crack/tile lines -->
  <g stroke="#222" stroke-width="1" opacity="0.5">
    <line x1="0" y1="580" x2="1200" y2="580"/>
    <line x1="0" y1="620" x2="1200" y2="620"/>
    <line x1="0" y1="660" x2="1200" y2="660"/>
    <line x1="200" y1="540" x2="200" y2="750"/>
    <line x1="400" y1="540" x2="400" y2="750"/>
    <line x1="600" y1="540" x2="600" y2="750"/>
    <line x1="800" y1="540" x2="800" y2="750"/>
    <line x1="1000" y1="540" x2="1000" y2="750"/>
  </g>
  <!-- Train tracks (below platform) -->
  <rect x="270" y="500" width="660" height="50" fill="#080810"/>
  <!-- Rail ties -->
  <g fill="#1a1820" opacity="0.8">
    <rect x="280" y="505" width="12" height="45" rx="1"/>
    <rect x="310" y="505" width="12" height="45" rx="1"/>
    <rect x="340" y="505" width="12" height="45" rx="1"/>
    <rect x="370" y="505" width="12" height="45" rx="1"/>
    <rect x="400" y="505" width="12" height="45" rx="1"/>
    <rect x="430" y="505" width="12" height="45" rx="1"/>
    <rect x="460" y="505" width="12" height="45" rx="1"/>
    <rect x="490" y="505" width="12" height="45" rx="1"/>
    <rect x="520" y="505" width="12" height="45" rx="1"/>
    <rect x="550" y="505" width="12" height="45" rx="1"/>
    <rect x="580" y="505" width="12" height="45" rx="1"/>
    <rect x="610" y="505" width="12" height="45" rx="1"/>
    <rect x="640" y="505" width="12" height="45" rx="1"/>
    <rect x="670" y="505" width="12" height="45" rx="1"/>
    <rect x="700" y="505" width="12" height="45" rx="1"/>
    <rect x="730" y="505" width="12" height="45" rx="1"/>
    <rect x="760" y="505" width="12" height="45" rx="1"/>
    <rect x="790" y="505" width="12" height="45" rx="1"/>
    <rect x="820" y="505" width="12" height="45" rx="1"/>
    <rect x="850" y="505" width="12" height="45" rx="1"/>
    <rect x="880" y="505" width="12" height="45" rx="1"/>
    <rect x="910" y="505" width="12" height="45" rx="1"/>
  </g>
  <!-- Rails -->
  <rect x="270" y="510" width="660" height="6" fill="#5a5858" rx="2"/>
  <rect x="270" y="538" width="660" height="6" fill="#5a5858" rx="2"/>
  <!-- Subway train car -->
  <rect x="270" y="140" width="660" height="365" fill="url(#subTrain)" rx="8"/>
  <!-- Train car top detail -->
  <rect x="270" y="140" width="660" height="20" fill="#8090a0" rx="8"/>
  <rect x="270" y="155" width="660" height="8" fill="#9aa8b8"/>
  <!-- Train car bottom detail -->
  <rect x="270" y="480" width="660" height="25" fill="#7080a0" rx="4"/>
  <!-- Train windows -->
  <g fill="#1a2030" rx="3">
    <rect x="290" y="175" width="75" height="95" rx="4" fill="#0e1828"/>
    <rect x="380" y="175" width="75" height="95" rx="4" fill="#0e1828"/>
    <rect x="470" y="175" width="75" height="95" rx="4" fill="#0e1828"/>
    <rect x="560" y="175" width="75" height="95" rx="4" fill="#0e1828"/>
    <rect x="650" y="175" width="75" height="95" rx="4" fill="#0e1828"/>
    <rect x="740" y="175" width="75" height="95" rx="4" fill="#0e1828"/>
    <rect x="830" y="175" width="85" height="95" rx="4" fill="#0e1828"/>
  </g>
  <!-- Window light inside train -->
  <rect x="290" y="175" width="75" height="95" rx="4" fill="#f5e8c0" opacity="0.12"/>
  <rect x="380" y="175" width="75" height="95" rx="4" fill="#f5e8c0" opacity="0.10"/>
  <rect x="470" y="175" width="75" height="95" rx="4" fill="#f5e8c0" opacity="0.14"/>
  <rect x="560" y="175" width="75" height="95" rx="4" fill="#f5e8c0" opacity="0.11"/>
  <rect x="650" y="175" width="75" height="95" rx="4" fill="#f5e8c0" opacity="0.13"/>
  <!-- Train doors -->
  <rect x="360" y="288" width="18" height="195" fill="#a0b0c0" rx="2"/>
  <rect x="552" y="288" width="18" height="195" fill="#a0b0c0" rx="2"/>
  <rect x="744" y="288" width="18" height="195" fill="#a0b0c0" rx="2"/>
  <!-- Door lines -->
  <line x1="369" y1="288" x2="369" y2="483" stroke="#8090a0" stroke-width="2"/>
  <line x1="561" y1="288" x2="561" y2="483" stroke="#8090a0" stroke-width="2"/>
  <!-- Train front headlight -->
  <ellipse cx="270" cy="350" rx="22" ry="22" fill="url(#subHeadlight)"/>
  <ellipse cx="270" cy="350" rx="60" ry="50" fill="#ffffff" opacity="0.06"/>
  <!-- Passengers silhouetted in windows -->
  <ellipse cx="327" cy="200" rx="14" ry="16" fill="#0a1020" opacity="0.7"/>
  <ellipse cx="417" cy="198" rx="12" ry="14" fill="#0a1020" opacity="0.6"/>
  <ellipse cx="507" cy="202" rx="14" ry="16" fill="#0a1020" opacity="0.7"/>
  <ellipse cx="597" cy="200" rx="12" ry="14" fill="#0a1020" opacity="0.6"/>
  <!-- People on platform -->
  <g opacity="0.8">
    <circle cx="120" cy="508" r="14" fill="#2a2030"/>
    <rect x="112" y="522" width="16" height="30" fill="#2a2030" rx="3"/>
    <circle cx="1080" cy="508" r="14" fill="#2a2030"/>
    <rect x="1072" y="522" width="16" height="30" fill="#2a2030" rx="3"/>
    <circle cx="155" cy="505" r="12" fill="#3a2a38"/>
    <rect x="148" y="517" width="14" height="28" fill="#3a2a38" rx="3"/>
    <circle cx="1045" cy="506" r="12" fill="#3a2a38"/>
    <rect x="1038" y="518" width="14" height="28" fill="#3a2a38" rx="3"/>
  </g>
  <!-- MTA circle logo hint -->
  <circle cx="130" cy="230" r="28" fill="#cc2244"/>
  <circle cx="130" cy="230" r="22" fill="none" stroke="white" stroke-width="3"/>
  <rect x="116" y="224" width="28" height="12" fill="white" rx="1"/>
</svg>
