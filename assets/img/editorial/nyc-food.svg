<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0e08"/>
      <stop offset="50%" stop-color="#3d1408"/>
      <stop offset="100%" stop-color="#1e0a04"/>
    </linearGradient>
    <radialGradient id="fdGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f04a10" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#d43a08" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8a1a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fdCounter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3828"/>
      <stop offset="100%" stop-color="#2e2018"/>
    </linearGradient>
    <radialGradient id="fdPizzaGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff8844" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff8844" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Restaurant interior background -->
  <rect width="1200" height="750" fill="url(#fdBg)"/>
  <rect width="1200" height="750" fill="url(#fdGlow)"/>
