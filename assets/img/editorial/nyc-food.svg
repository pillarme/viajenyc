    <rect x="145" y="57" width="90" height="22" rx="2" fill="#3a1606"/>
    <rect x="240" y="57" width="90" height="22" rx="2" fill="#401c0a"/>
    <rect x="335" y="57" width="90" height="22" rx="2" fill="#3c1808"/>
    <rect x="430" y="57" width="90" height="22" rx="2" fill="#3e1a08"/>
    <rect x="525" y="57" width="90" height="22" rx="2" fill="#3a1606"/>
