  <path d="M955,593 Q985,585 1015,596 Q1045,607 1075,596 Q1100,585 1110,593" fill="none" stroke="#f5c518" stroke-width="4" stroke-linecap="round"/>
  <!-- Food steam wisps -->
  <path d="M545,160 Q540,140 548,120" fill="none" stroke="white" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <path d="M600,150 Q596,128 604,108" fill="none" stroke="white" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  <path d="M655,160 Q651,140 658,120" fill="none" stroke="white" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
