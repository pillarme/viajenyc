  <circle cx="500" cy="390" r="30" fill="#aa2810"/>
  <circle cx="700" cy="390" r="35" fill="#8a1a08"/>
  <circle cx="700" cy="390" r="30" fill="#aa2810"/>
  <circle cx="600" cy="450" r="35" fill="#8a1a08"/>
