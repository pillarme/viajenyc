  <g fill="#f0e0b0" opacity="0.8">
    <ellipse cx="155" cy="548" rx="5" ry="2" transform="rotate(-30 155 548)"/>
    <ellipse cx="200" cy="542" rx="5" ry="2" transform="rotate(15 200 542)"/>
    <ellipse cx="240" cy="558" rx="5" ry="2" transform="rotate(-10 240 558)"/>
    <ellipse cx="265" cy="585" rx="5" ry="2" transform="rotate(25 265 585)"/>
    <ellipse cx="248" cy="618" rx="5" ry="2" transform="rotate(40 248 618)"/>
    <ellipse cx="205" cy="638" rx="5" ry="2" transform="rotate(-5 205 638)"/>
    <ellipse cx="158" cy="634" rx="5" ry="2" transform="rotate(20 158 634)"/>
    <ellipse cx="120" cy="614" rx="5" ry="2" transform="rotate(-40 120 614)"/>
    <ellipse cx="107" cy="582" rx="5" ry="2" transform="rotate(10 107 582)"/>
    <ellipse cx="120" cy="555" rx="5" ry="2" transform="rotate(35 120 555)"/>
  </g>
  <!-- Hot dog (right foreground) -->
  <ellipse cx="1030" cy="596" rx="130" ry="42" fill="#c8a060"/>
  <rect x="940" y="575" width="180" height="42" fill="#c8a060" rx="16"/>
