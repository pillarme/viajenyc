  <circle cx="600" cy="380" r="32" fill="#f0c460"/>
  <circle cx="720" cy="420" r="28" fill="#e8b850"/>
  <circle cx="550" cy="460" r="22" fill="#f0c060"/>
  <circle cx="650" cy="460" r="22" fill="#e8b850"/>
  <!-- Pepperoni circles -->
