<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2848"/>
      <stop offset="30%" stop-color="#1e4870"/>
      <stop offset="60%" stop-color="#c07040"/>
      <stop offset="80%" stop-color="#d88040"/>
      <stop offset="100%" stop-color="#b06030"/>
    </linearGradient>
    <linearGradient id="skyWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3858"/>
      <stop offset="100%" stop-color="#0a1828"/>
    </linearGradient>
    <radialGradient id="skySunset" cx="65%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#ffcc66" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ff9944" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff9944" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c07040" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#1a3858" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a1828" stop-opacity="0"/>
    </linearGradient>
    <pattern id="skyWin" x="0" y="0" width="10" height="12" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="3.5" height="5" fill="#f5c518" opacity="0.60"/>
      <rect x="5.5" y="1" width="3.5" height="5" fill="#f5c518" opacity="0.28"/>
      <rect x="1" y="7" width="3.5" height="5" fill="#f5c518" opacity="0.42"/>
      <rect x="5.5" y="7" width="3.5" height="5" fill="#f5c518" opacity="0.55"/>
    </pattern>
  </defs>
  <!-- Sky gradient (dusk) -->
  <rect width="1200" height="750" fill="url(#skySky)"/>
  <rect width="1200" height="750" fill="url(#skySunset)"/>
  <!-- Hazy clouds (silhouette) -->
  <ellipse cx="200" cy="130" rx="160" ry="45" fill="#d08048" opacity="0.25"/>
  <ellipse cx="160" cy="134" rx="100" ry="34" fill="#d08048" opacity="0.25"/>
  <ellipse cx="960" cy="110" rx="140" ry="40" fill="#c87040" opacity="0.2"/>
  <!-- NYC SKYLINE SILHOUETTE -->
  <!-- Built as path going left to right across the horizon -->
  <!-- Horizon line at y=430 -->
  <!-- Lower Manhattan / Wall St area (far left) -->
  <rect x="0" y="280" width="38" height="260" fill="#1a2a3a"/>
  <rect x="42" y="250" width="32" height="290" fill="#1c2c3e"/>
  <rect x="78" y="268" width="40" height="272" fill="#182838"/>
  <rect x="122" y="238" width="36" height="302" fill="#1e2e40"/>
  <!-- WTC/Seaport -->
  <rect x="162" y="160" width="44" height="380" fill="#202e40"/>
  <rect x="170" y="140" width="28" height="30" fill="#222e42"/>
  <rect x="210" y="185" width="42" height="355" fill="#1e2c3e"/>
  <rect x="256" y="220" width="38" height="320" fill="#1a2a3a"/>
  <rect x="298" y="242" width="44" height="298" fill="#1c2c3e"/>
  <!-- Battery Park area -->
  <rect x="346" y="268" width="36" height="272" fill="#18283a"/>
  <rect x="386" y="248" width="40" height="292" fill="#1e2e3e"/>
  <rect x="430" y="260" width="36" height="280" fill="#1a2a3c"/>
  <!-- Lower Midtown -->
  <rect x="470" y="232" width="42" height="308" fill="#1c2e40"/>
  <rect x="516" y="252" width="38" height="288" fill="#1a2c3e"/>
  <!-- Empire State Building (focal point) -->
  <rect x="558" y="120" width="54" height="420" fill="#202e42"/>
  <rect x="572" y="95" width="26" height="50" fill="#222e44"/>
  <rect x="580" y="72" width="10" height="34" fill="#242e46"/>
  <rect x="584" y="60" width="4" height="20" fill="#262e48"/>
  <!-- ESB spire light -->
  <circle cx="586" cy="58" r="3.5" fill="#f5c518" opacity="0.95"/>
  <ellipse cx="586" cy="63" rx="8" ry="5" fill="#f5c518" opacity="0.18"/>
  <!-- Midtown East / Chrysler area -->
  <rect x="616" y="160" width="48" height="380" fill="#1e2c3e"/>
  <!-- Chrysler spire -->
  <rect x="624" y="140" width="32" height="28" fill="#202e3e"/>
  <polygon points="640,115 624,140 656,140" fill="#222e40"/>
  <polygon points="640,98 632,115 648,115" fill="#242e42"/>
  <circle cx="640" cy="96" r="2" fill="#9ab0d0" opacity="0.7"/>
  <rect x="668" y="182" width="44" height="358" fill="#1c2c3c"/>
  <rect x="716" y="195" width="42" height="345" fill="#1e2c3e"/>
  <rect x="762" y="208" width="48" height="332" fill="#1a2a3c"/>
  <!-- Upper Midtown / Sutton Place -->
  <rect x="814" y="228" width="40" height="312" fill="#1c2e40"/>
  <rect x="858" y="245" width="42" height="295" fill="#1a2c3a"/>
  <rect x="904" y="228" width="38" height="312" fill="#1e2e3e"/>
  <rect x="946" y="248" width="44" height="292" fill="#1c2c3c"/>
  <!-- Upper East Side / 59th St -->
  <rect x="994" y="260" width="40" height="280" fill="#1a2a3a"/>
  <rect x="1038" y="242" width="44" height="298" fill="#1c2c3e"/>
  <rect x="1086" y="255" width="42" height="285" fill="#18283a"/>
  <rect x="1132" y="262" width="40" height="278" fill="#1a2a3c"/>
  <rect x="1176" y="248" width="30" height="292" fill="#1c2a3a"/>
  <!-- Horizon ground line -->
  <rect x="0" y="538" width="1200" height="12" fill="#182838"/>
  <!-- Window pattern on all buildings -->
  <rect x="0" y="280" width="1200" height="260" fill="url(#skyWin)" opacity="0.55"/>
  <!-- Water / Hudson / East River -->
  <rect x="0" y="550" width="1200" height="200" fill="url(#skyWater)"/>
  <rect x="0" y="550" width="1200" height="200" fill="url(#skyReflect)"/>
  <!-- Water shimmers -->
  <path d="M0,575 Q200,565 400,575 Q600,585 800,575 Q1000,565 1200,575" fill="none" stroke="#3a6890" stroke-width="2" opacity="0.5"/>
  <path d="M0,600 Q300,590 600,600 Q900,610 1200,600" fill="none" stroke="#3a6890" stroke-width="1.5" opacity="0.4"/>
  <path d="M0,630 Q250,620 500,630 Q750,640 1000,630 Q1100,624 1200,630" fill="none" stroke="#2a5878" stroke-width="1" opacity="0.3"/>
  <!-- Sunset reflection stripe on water -->
  <ellipse cx="850" cy="565" rx="280" ry="28" fill="#d87030" opacity="0.18"/>
  <path d="M620,555 Q800,545 980,555 Q1100,561 1200,556" fill="none" stroke="#ffaa44" stroke-width="3" opacity="0.22"/>
  <path d="M680,575 Q840,566 1000,575" fill="none" stroke="#ffcc66" stroke-width="2" opacity="0.15"/>
  <!-- City lights reflections in water -->
  <rect x="582" y="550" width="8" height="100" fill="#f5c518" opacity="0.08"/>
  <rect x="638" y="550" width="5" height="90" fill="#9ab0d0" opacity="0.07"/>
</svg>
