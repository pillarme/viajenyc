<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="muBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5efe4"/>
      <stop offset="100%" stop-color="#e8dcc8"/>
    </linearGradient>
    <linearGradient id="muFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c4a0"/>
      <stop offset="100%" stop-color="#b8a888"/>
    </linearGradient>
    <linearGradient id="muArch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="100%" stop-color="#c8b890"/>
    </linearGradient>
    <radialGradient id="muSkylight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#a8c8e8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#d0e4f4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f5efe4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="muSpotlight" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff8e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Interior warm walls -->
  <rect width="1200" height="750" fill="url(#muBg)"/>
  <!-- Skylight glow from top -->
  <rect width="1200" height="750" fill="url(#muSkylight)"/>
  <rect width="1200" height="750" fill="url(#muSpotlight)"/>
  <!-- Coffered ceiling panels -->
  <g fill="#ddd4c0" stroke="#c8b898" stroke-width="2">
    <rect x="0" y="0" width="300" height="160" rx="2"/>
    <rect x="305" y="0" width="290" height="160" rx="2"/>
    <rect x="600" y="0" width="290" height="160" rx="2"/>
    <rect x="895" y="0" width="305" height="160" rx="2"/>
  </g>
  <g fill="#cac0aa" stroke="#b8a890" stroke-width="1.5">
    <rect x="15" y="12" width="270" height="136" rx="1"/>
    <rect x="320" y="12" width="260" height="136" rx="1"/>
    <rect x="615" y="12" width="260" height="136" rx="1"/>
    <rect x="910" y="12" width="275" height="136" rx="1"/>
  </g>
  <!-- Crown molding -->
  <rect x="0" y="158" width="1200" height="18" fill="#c8b898"/>
  <rect x="0" y="168" width="1200" height="6" fill="#b8a880"/>
  <!-- === CLASSICAL COLUMNS === -->
  <!-- Column capitals (top) -->
  <rect x="52" y="172" width="96" height="24" fill="#d8d0c0" rx="2"/>
  <rect x="55" y="165" width="90" height="12" fill="#e0d8c8"/>
  <rect x="302" y="172" width="96" height="24" fill="#d8d0c0" rx="2"/>
  <rect x="305" y="165" width="90" height="12" fill="#e0d8c8"/>
  <rect x="802" y="172" width="96" height="24" fill="#d8d0c0" rx="2"/>
  <rect x="805" y="165" width="90" height="12" fill="#e0d8c8"/>
  <rect x="1052" y="172" width="96" height="24" fill="#d8d0c0" rx="2"/>
  <rect x="1055" y="165" width="90" height="12" fill="#e0d8c8"/>
  <!-- Column shafts -->
  <rect x="72" y="196" width="56" height="390" fill="#ddd4c2"/>
  <rect x="80" y="196" width="10" height="390" fill="#e8e0d0" opacity="0.5"/>
  <rect x="322" y="196" width="56" height="390" fill="#ddd4c2"/>
  <rect x="330" y="196" width="10" height="390" fill="#e8e0d0" opacity="0.5"/>
  <rect x="822" y="196" width="56" height="390" fill="#ddd4c2"/>
  <rect x="830" y="196" width="10" height="390" fill="#e8e0d0" opacity="0.5"/>
  <rect x="1072" y="196" width="56" height="390" fill="#ddd4c2"/>
  <rect x="1080" y="196" width="10" height="390" fill="#e8e0d0" opacity="0.5"/>
  <!-- Column bases -->
  <rect x="60" y="578" width="80" height="16" fill="#c8c0b0" rx="2"/>
  <rect x="55" y="590" width="90" height="10" fill="#b8b0a0"/>
  <rect x="310" y="578" width="80" height="16" fill="#c8c0b0" rx="2"/>
  <rect x="305" y="590" width="90" height="10" fill="#b8b0a0"/>
  <rect x="810" y="578" width="80" height="16" fill="#c8c0b0" rx="2"/>
  <rect x="805" y="590" width="90" height="10" fill="#b8b0a0"/>
  <rect x="1060" y="578" width="80" height="16" fill="#c8c0b0" rx="2"/>
  <rect x="1055" y="590" width="90" height="10" fill="#b8b0a0"/>
  <!-- Arched gallery doorway (center) -->
  <rect x="490" y="200" width="220" height="390" fill="#d0c8b4"/>
  <path d="M490,260 Q600,180 710,260" fill="#d8d0c0"/>
  <rect x="497" y="210" width="206" height="15" fill="#c8c0aa"/>
  <!-- Doorway inner arch (darker) -->
  <rect x="498" y="265" width="204" height="325" fill="#2a2018" opacity="0.15"/>
  <!-- Corridor glimpse through door -->
  <rect x="530" y="265" width="140" height="320" fill="#c8b890" opacity="0.6"/>
  <rect x="540" y="265" width="120" height="320" fill="#b8a880" opacity="0.4"/>
  <!-- Frieze above arch -->
  <rect x="490" y="196" width="220" height="8" fill="#c0b898"/>
  <!-- === ART ON WALLS === -->
  <!-- Left wall paintings -->
  <!-- Frame 1 (left wall) -->
  <rect x="160" y="220" width="120" height="160" fill="#8a7a60" rx="2"/>
  <rect x="166" y="226" width="108" height="148" fill="#9a8a70" rx="1"/>
  <!-- Painting content (landscape) -->
  <rect x="168" y="228" width="104" height="144" fill="#8ab0d0"/>
  <rect x="168" y="310" width="104" height="62" fill="#6a9040"/>
  <rect x="168" y="295" width="104" height="18" fill="#8ab888"/>
  <!-- Frame 2 (left wall) -->
  <rect x="160" y="408" width="120" height="120" fill="#8a7a60" rx="2"/>
  <rect x="166" y="414" width="108" height="108" fill="#9a8a70" rx="1"/>
  <rect x="168" y="416" width="104" height="104" fill="#c8985a"/>
  <rect x="185" y="430" width="70" height="55" fill="#a87840" opacity="0.7"/>
  <ellipse cx="220" cy="475" rx="25" ry="35" fill="#d0aa70" opacity="0.8"/>
  <!-- Right wall paintings -->
  <!-- Frame 3 -->
  <rect x="920" y="220" width="120" height="160" fill="#8a7a60" rx="2"/>
  <rect x="926" y="226" width="108" height="148" fill="#9a8a70" rx="1"/>
  <rect x="928" y="228" width="104" height="144" fill="#4870a0"/>
  <rect x="928" y="310" width="104" height="62" fill="#4a7060"/>
  <ellipse cx="980" cy="285" rx="30" ry="40" fill="#c8a870" opacity="0.7"/>
  <!-- Frame 4 -->
  <rect x="920" y="408" width="120" height="120" fill="#8a7a60" rx="2"/>
  <rect x="926" y="414" width="108" height="108" fill="#9a8a70" rx="1"/>
  <rect x="928" y="416" width="104" height="104" fill="#d4c090"/>
  <rect x="942" y="428" width="76" height="78" fill="#b89858" opacity="0.6"/>
  <!-- === STATUE pedestal === -->
  <rect x="560" y="360" width="80" height="120" fill="#c8c0b0"/>
  <rect x="552" y="470" width="96" height="18" fill="#b8b0a0"/>
  <!-- Statue silhouette (draped figure) -->
  <ellipse cx="600" cy="338" rx="22" ry="24" fill="#b0a898"/>
  <path d="M578,355 Q570,380 565,440 Q585,450 615,450 Q630,440 625,380 Q618,355 600,350 Z" fill="#b0a898"/>
  <!-- Statue raised arm -->
  <line x1="578" y1="370" x2="552" y2="340" stroke="#b0a898" stroke-width="10" stroke-linecap="round"/>
  <!-- === MARBLE FLOOR === -->
  <rect x="0" y="600" width="1200" height="150" fill="url(#muFloor)"/>
  <!-- Marble tile grid -->
  <g stroke="#c8b890" stroke-width="1.5" opacity="0.5">
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="0" y1="680" x2="1200" y2="680"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
    <line x1="150" y1="600" x2="150" y2="750"/>
    <line x1="300" y1="600" x2="300" y2="750"/>
    <line x1="450" y1="600" x2="450" y2="750"/>
    <line x1="600" y1="600" x2="600" y2="750"/>
    <line x1="750" y1="600" x2="750" y2="750"/>
    <line x1="900" y1="600" x2="900" y2="750"/>
    <line x1="1050" y1="600" x2="1050" y2="750"/>
  </g>
  <!-- Marble veining -->
  <path d="M0,615 Q100,620 200,614 Q300,608 400,616" fill="none" stroke="#c0a878" stroke-width="1" opacity="0.3"/>
  <path d="M450,648 Q550,642 650,650 Q750,658 850,644" fill="none" stroke="#c0a878" stroke-width="1" opacity="0.3"/>
  <!-- Museum visitors (silhouettes) -->
  <g opacity="0.55">
    <circle cx="220" cy="590" r="16" fill="#3a3020"/>
    <rect x="212" y="606" width="16" height="35" fill="#3a3020" rx="3"/>
    <circle cx="970" cy="592" r="16" fill="#3a3020"/>
    <rect x="962" y="608" width="16" height="35" fill="#3a3020" rx="3"/>
    <!-- Couple -->
    <circle cx="400" cy="595" r="15" fill="#2a2018"/>
    <rect x="393" y="610" width="14" height="32" fill="#2a2018" rx="3"/>
    <circle cx="430" cy="592" r="13" fill="#342818"/>
    <rect x="423" y="605" width="14" height="32" fill="#342818" rx="3"/>
  </g>
  <!-- Warm spot light pools on floor -->
  <ellipse cx="600" cy="640" rx="120" ry="30" fill="#fff8e0" opacity="0.25"/>
  <ellipse cx="200" cy="640" rx="100" ry="25" fill="#fff8e0" opacity="0.15"/>
  <ellipse cx="1000" cy="640" rx="100" ry="25" fill="#fff8e0" opacity="0.15"/>
</svg>
